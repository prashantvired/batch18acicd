name: Deploy HTML file

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: code checkout
      uses: actions/checkout@v7
    - name: listing files
      run: ls

  security:
    runs-on: ubuntu-latest
    steps:
    - name: run security scan
      run: |
        echo "Running security scan.."

  deploy:
    needs: [testing, security]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: deploy
      run: |
        ls
        echo "Deployment started"
      
    

