name: Deploy HTML file

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
    - name: code checkout
      uses: actions/checkout@v7
    
    - name: run bash command
      run: whoami

    - name: more commands
      run: pwd

    - name: listing files
      run: ls

    - name: Execute remote SSH commands using password
      uses: appleboy/ssh-action@v1
      with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: whoami
    
